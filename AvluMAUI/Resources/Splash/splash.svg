<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">

  <!-- Avlu logomark (80×80, centered at x=64, y starts at 13) -->

  <!-- Frame: rounded rect -->
  <rect x="29" y="13" width="70" height="70" rx="18"
        fill="none" stroke="white" stroke-width="3.5"/>

  <!-- Arch (accent gold) -->
  <path d="M 51 65 V 48 A 13 13 0 0 1 77 48 V 65"
        fill="none" stroke="#C8A15A" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Baseline -->
  <line x1="47" y1="65" x2="81" y2="65"
        stroke="white" stroke-width="3.5" stroke-linecap="round"/>

  <!-- "avlu" wordmark -->
  <text x="64" y="102"
        font-family="sans-serif" font-size="19" font-weight="600"
        fill="white" text-anchor="middle" letter-spacing="-0.8">avlu</text>

  <!-- Subtitle -->
  <text x="64" y="116"
        font-family="sans-serif" font-size="5.5"
        fill="white" fill-opacity="0.5"
        text-anchor="middle" letter-spacing="2.5">APARTMAN YÖNETİMİ</text>

</svg>
